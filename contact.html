<body>
    <header>
        <h1><a href="index.html">ALMIN<span class="resaltado">GO</span></a></h1>

        <nav>
            <details>
                <summary><img src="img/menu-icon.png" alt="Menu"></summary>
                <ul>
                    <li><a href="index.html" class="lineanimacion" style="--chars:19">Home</a></li>
                    <br>
                    <li><a href="about.html" class="lineanimacion" style="--chars:19">About</a></li>

                </ul>
            </details>
        </nav>

    </header>
    <main>

        <div class="contact">

            <section class="contact-left">
                <form class="contact-form">
                    <h2 class="contact-title">START PROJECT</h2>

                    <div class="contact-row">
                        <input type="text" id="name" name="name" placeholder="Name" autocomplete="given-name">

                        <input type="text" id="last-name" name="last-name" placeholder="Last Name" autocomplete="family-name">
                    </div>

                    <input type="email" id="email" name="email" placeholder="Email" autocomplete="email">

                    <div class="contact-type">
                        <legend>Who Are You?</legend>
                        <div class="contact-type-options">
                            <label class="contact-option">
                                <input type="radio" name="client-type" value="business">
                                <span>Business</span>
                            </label>
                            <label class="contact-option">
                                <input type="radio" name="client-type" value="individual">
                                <span>Individual</span>
                            </label>
                        </div>
                    </div>

                    <textarea class="textarea" id="idea" name="idea" placeholder="Describe your idea..."></textarea>

                    <button type="button" class="contact-button">CONTACT</button>
                </form>
            </section>

            <section class="contact-right">
                <img src="img/Ilustración 3D de contacto en tonos púrpura y lima.png" alt="3D illustration of a phone with an envelope, call and location icons">
            </section>

        </div>
</main>

                <a href="contact.html">Contact</a>
            </article>

        </section>
    </footer>
